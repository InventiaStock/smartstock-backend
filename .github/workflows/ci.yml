name: CI

# Builds and tests the Web Services on every push and pull request.
# (Compila y prueba los Web Services en cada push y pull request.)
on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Unit tests
        run: dotnet test --no-build --configuration Release --verbosity normal